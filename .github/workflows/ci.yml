name: Wonderlust CI

on:
  push:
    branches: [main, freebuff/0a08f60b938792e9d9f4fbe2]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run types

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wonderlust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/wonderlust_test

      - name: Run seed
        run: node scripts/seed.mjs
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/wonderlust_test

      - name: Build production bundle
        run: npm run build

      - name: Run API smoke tests
        run: npm run start &
        env:
          BASE: http://localhost:3000
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/wonderlust_test

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/destinations > /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 2
          done
